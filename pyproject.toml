[project]
name = "pepsico-multi-agent-po-demo"
version = "0.1.0"
description = "Durable multi-agent purchase order approval demo built on Temporal, LangGraph, and Amazon Bedrock"
requires-python = ">=3.12,<3.14"
dependencies = [
    "temporalio[langgraph,pydantic]",
    "langchain-aws",
    "boto3",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
